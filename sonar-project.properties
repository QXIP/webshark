sonar.projectKey=qxip-webshark
sonar.projectName=webshark-ng
sonar.projectVersion=2.0.2

# Scan all source: Node.js API, shell scripts, Dockerfile, CI config
sonar.sources=api,sharkd,scripts,entrypoint.sh,Dockerfile,docker-compose.yml,.github/workflows

# Exclude vendored/generated paths that produce noise without value
sonar.exclusions=\
  web/**,\
  captures/**,\
  .scannerwork/**,\
  reports/**

# Test files (kept separate so SonarQube tracks test coverage independently)
sonar.tests=api/test
sonar.test.inclusions=api/test/**/*.js

sonar.sourceEncoding=UTF-8

# Skip server-side JRE provisioning — use the local JRE instead.
sonar.scanner.skipJreProvisioning=true
