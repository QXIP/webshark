version: '2'

services:

  webshark:
    # image: ghcr.io/qxip/webshark:latest
    build: .
    container_name: webshark
    expose:
      - "8085"
    ports:
      - "8085:8085"
    volumes:
      - ./captures:/captures
    environment:
      # Keep socket under CAPTURES_PATH (writable, exclusive to this volume).
      - SHARKD_SOCKET=/captures/sharkd.sock
      - CAPTURES_PATH=/captures/
      # Optional Stenographer bridge (#42):
      # - STENOGRAPHER_URL=https://steno.example.com:1234
      # - STENOGRAPHER_PACKET_LIMIT=100000
      # - STENOGRAPHER_TIMEOUT_MS=120000
